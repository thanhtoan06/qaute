# Tên ứng dụng Spring Boot.
spring.application.name=qaute
# Các profile được kích hoạt mặc định.
spring.profiles.default=dev,demo,google
# Tệp cấu hình cục bộ được nạp nếu tồn tại.
spring.config.import=optional:classpath:application-local.properties

# Cổng HTTP của ứng dụng.
server.port=8090
# Bật hoặc tắt trang lỗi mặc định của Spring.
server.error.whitelabel.enabled=false
# Bảng mã mặc định cho nội dung HTTP.
server.servlet.encoding.charset=UTF-8
# Ép áp dụng bảng mã đã cấu hình.
server.servlet.encoding.force=true

# Thư mục gốc chứa các trang JSP.
spring.mvc.view.prefix=/WEB-INF/views/
# Phần mở rộng của trang JSP.
spring.mvc.view.suffix=.jsp

# Chế độ Hibernate dùng để kiểm tra schema.
spring.jpa.hibernate.ddl-auto=validate
# Quản lý vòng đời session JPA ngoài tầng repository.
spring.jpa.open-in-view=false
# Align MySQL defaults and NOW() queries with the application's Vietnam timezone.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
# Múi giờ sử dụng cho thao tác JDBC.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# Múi giờ mặc định khi xử lý JSON.
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# Định dạng ngày giờ JSON dưới dạng chuỗi.
spring.jackson.serialization.write-dates-as-timestamps=false

# Bật quản lý schema bằng Flyway.
spring.flyway.enabled=true
# Vị trí các migration SQL.
spring.flyway.locations=classpath:db/migration
# Cho phép chạy migration không theo thứ tự phiên bản.
spring.flyway.out-of-order=true
# Cấu hình tạo baseline cho schema hiện có.
spring.flyway.baseline-on-migrate=false
# Sửa metadata Flyway khi ứng dụng khởi động.
spring.flyway.repair-on-migrate=true

# Dung lượng tối đa cho mỗi tập tải lên.
spring.servlet.multipart.max-file-size=10MB
# Dung lượng tối đa cho mỗi yêu cầu tải lên.
spring.servlet.multipart.max-request-size=30MB

# Cổng kết nối máy chủ SMTP.
spring.mail.port=587
# Bật xác thực SMTP.
spring.mail.properties.mail.smtp.auth=true
# Bật mã hóa STARTTLS cho SMTP.
spring.mail.properties.mail.smtp.starttls.enable=true

# Định dạng mức log và trace ID.
logging.pattern.level=%5p [%X{traceId:-}]